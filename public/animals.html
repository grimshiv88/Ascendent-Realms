<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animal Lineup</title>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <style>html,body{margin:0;height:100%;background:#cfd8c8}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { ANIMALS } from './js/data/animals.mjs';
import { buildAnimal, animateAnimal, lieDown } from './js/world/animalbody.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true }); r.shadowMap.enabled = true;
r.setSize(innerWidth, innerHeight, false); r.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#b8c8d8');
scene.add(new THREE.HemisphereLight('#ffffff', '#5a6a3a', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2); sun.position.set(5, 10, 8); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: '#6a8a4a' })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const ids = (q.get('ids') || Object.keys(ANIMALS).join(',')).split(',');
const cols = Math.ceil(Math.sqrt(ids.length * 1.6));
const list = [];
ids.forEach((id, i) => { const b = buildAnimal(ANIMALS[id]); b.position.set((i % cols) * 3.4 - cols * 1.7, 0, -Math.floor(i / cols) * 3.4); b.rotation.y = Number(q.get('rot') ?? 1.2); scene.add(b); list.push(b); b.traverse((o) => { o.castShadow = true; }); });
const cam = new THREE.PerspectiveCamera(Number(q.get('fov') || 40), innerWidth / innerHeight, 0.05, 200);
const rows = Math.ceil(ids.length / cols);
cam.position.set(Number(q.get('cx') ?? 0), Number(q.get('cy') ?? 6 + rows), Number(q.get('cz') ?? 9 + rows * 1.5)); cam.lookAt(0, 0.6, -rows * 1.5);
const speed = Number(q.get('speed') || 0), t0 = Number(q.get('t') || 0);
const dead = q.has('dead');
function frame(t) { for (const b of list) { if (dead) lieDown(b, 1); else { animateAnimal(b, t0 + t / 1000, speed); } } r.render(scene, cam); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.ready = true;
</script>
</body>
</html>
