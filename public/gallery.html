<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <style>
    :root { --gold: #f5c84c; --ink: #f4ead2; --quiet: #b9ab8a; --line: #5c4413; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0906; color: var(--ink); font-family: 'Cinzel', Georgia, serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 1.1rem; color: var(--gold); letter-spacing: 0.1em; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; }
    button { font: 0.85rem 'Cinzel', serif; color: var(--ink); background: #1b140b; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
    button[aria-pressed="true"] { background: var(--gold); color: #1b1203; border-color: var(--gold); }
    #view { position: relative; flex: 1; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #labels { position: absolute; left: 0; right: 0; bottom: 10px; display: grid; padding: 0 16px; pointer-events: none; }
    #labels div { text-align: center; font-size: 0.8rem; color: var(--quiet); }
    #labels b { display: block; color: var(--ink); font-weight: 700; }
    #note { padding: 8px 16px; font: 0.8rem Georgia, serif; color: var(--quiet); border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>Character Gallery</h1>
    <div class="group" id="races"></div>
    <div class="group" id="forms"></div>
  </header>
  <div id="view">
    <canvas id="c"></canvas>
    <div id="labels"></div>
  </div>
  <p id="note">Designer view only: players never see the evolution line. Drag to turn the characters.</p>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
