<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Beasts test</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<style>html,body{margin:0;height:100%}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// dev page: one great beast (?kind=fire_dragon&air=1&open=1&dead=0&t=0.3&cx=..&cy=..&cz=..)
import * as THREE from 'three';
import { BEASTS } from './js/data/beasts.mjs';
import { buildBeast, animateBeast, makeBreath } from './js/world/beasts.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(q.get('bg') || '#9ab0c8');
scene.add(new THREE.HemisphereLight('#ffffff', '#5a6a3a', 1.5));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2); sun.position.set(10, 20, 15); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: q.get('ground') || '#6a7a5a' })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const def = BEASTS[q.get('kind') || 'fire_dragon'];
const b = buildBeast(def);
const air = Number(q.get('air') || 0);
b.position.y = air; b.rotation.y = Number(q.get('rot') ?? 0.9);
scene.add(b);
const open = q.get('open') === '1';
let breath = null;
if (open && def.breath) { breath = makeBreath(def.breath); scene.add(breath); }
const H = b.userData.height;
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
const L = Math.max(def.len, (def.height || 0) * 1.3);
cam.position.set(Number(q.get('cx') ?? L * 1.2), Number(q.get('cy') ?? H * 1.2 + air), Number(q.get('cz') ?? L * 1.4)); cam.lookAt(0, H * 0.5 + air, 0);
const t0 = Number(q.get('t') || 0);
function frame(ms) {
  const t = t0 + (q.get('still') ? 0 : ms / 1000);
  animateBeast(b, t, { air, open, speed: 0, dead: Number(q.get('dead') || 0) });
  if (breath) { b.updateMatrixWorld(true); b.userData.beast.mouth.getWorldPosition(breath.position); breath.lookAt(breath.position.x + Math.sin(b.rotation.y) * 10, 0, breath.position.z + Math.cos(b.rotation.y) * 10); breath.userData.tick(t); }
  r.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
